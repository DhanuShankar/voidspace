# ============================================================================
# VOID Cloud IDE - Prometheus Configuration
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'void-cloud-ide'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Rule files
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# Scrape configurations
scrape_configs:
  # ========================================================================
  # Prometheus Self-Monitoring
  # ========================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ========================================================================
  # Application Metrics - Express.js
  # ========================================================================
  - job_name: 'void-app'
    static_configs:
      - targets: ['app:3000']
        labels:
          service: 'void-api'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # ========================================================================
  # Node Exporter (for host metrics)
  # ========================================================================
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*):.*'
        target_label: instance
        replacement: '$1'

  # ========================================================================
  # PostgreSQL Exporter
  # ========================================================================
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  # ========================================================================
  # Redis Exporter
  # ========================================================================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # ========================================================================
  # cAdvisor - Container Metrics
  # ========================================================================
  - job_name: 'cAdvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisory'

  # ========================================================================
  # Nginx RTMP/VTS Exporter (if using nginx-vts-exporter)
  # ========================================================================
  # - job_name: 'nginx'
  #   static_configs:
  #     - targets: ['nginx-vts-exporter:9113']
  #       labels:
  #         service: 'nginx'
