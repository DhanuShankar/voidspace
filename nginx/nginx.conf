# ============================================================================
# VOID Cloud IDE - Nginx Reverse Proxy Configuration
# ============================================================================
# This configuration supports:
# - HTTP to HTTPS redirect
# - SSL/TLS termination
# - Load balancing (for multi-instance deployments)
# - WebSocket proxying
# - Static file serving
# - Health checks
# ============================================================================

user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ========================================================================
    # Log Format
    # ========================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '$request_time $upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ========================================================================
    # Performance Optimizations
    # ========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ========================================================================
    # Rate Limiting
    # ========================================================================
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=websocket:10m rate=100r/s;

    # ========================================================================
    # Upstream - Application Servers
    # ========================================================================
    upstream void_backend {
        # For single instance
        server app:3000 max_fails=3 fail_timeout=30s;

        # For load balancing multiple instances, uncomment:
        # server app1:3000 max_fails=3 fail_timeout=30s;
        # server app2:3000 max_fails=3 fail_timeout=30s;
        # server app3:3000 max_fails=3 fail_timeout=30s;

        # Health check
        zone void_backend 64k;
    }

    # ========================================================================
    # Include additional configurations
    # ========================================================================
    include /etc/nginx/conf.d/*.conf;
}
