# ============================================================================
# VOID Cloud IDE - Cloud Build Configuration
# ============================================================================
# This file configures Google Cloud Build for container image building
# and deployment to Cloud Run
# ============================================================================

steps:
  # ========================================================================
  # Build Step 1: Install dependencies and build application
  # ========================================================================
  - name: 'node:20-alpine'
    id: 'install-deps'
    dir: 'build-deps'
    entrypoint: sh
    args:
      - '-c'
      - |
        # Copy source code
        cp -r /workspace/* /workspace/build-deps/

        # Install dependencies
        npm ci

  - name: 'node:20-alpine'
    id: 'build'
    dir: 'build-deps'
    entrypoint: sh
    args:
      - '-c'
      - |
        # Build frontend
        npm run build

  # ========================================================================
  # Build Step 2: Build Docker image
  # ========================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    dir: 'build-deps'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/void-cloud-ide:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/void-cloud-ide:latest'
      - '-f'
      - '../Dockerfile'
      - '..'

  # ========================================================================
  # Build Step 3: Push to Container Registry
  # ========================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    dir: 'build-deps'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/void-cloud-ide:$SHORT_SHA'
      - 'gcr.io/$PROJECT_ID/void-cloud-ide:latest'

  # ========================================================================
  # Deploy to Cloud Run (Production)
  # ========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-production'
    dir: 'build-deps'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'void-cloud-ide'
      - '--image'
      - 'gcr.io/$PROJECT_ID/void-cloud-ide:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '100'
      - '--concurrency'
      - '50'
      - '--timeout'
      - '3600'
      - '--set-env-vars'
      - 'NODE_ENV=production'
      - '--set-env-vars'
      - 'PORT=3000'
      - '--set-secrets'
      - 'DATABASE_URL=void-db-credentials:latest'
      - '--set-secrets'
      - 'REDIS_URL=void-redis-credentials:latest'
      - '--set-secrets'
      - 'ANTHROPIC_API_KEY=void-api-keys:anthropic'
      - '--set-secrets'
      - 'GEMINI_API_KEY=void-api-keys:gemini'
      - '--set-secrets'
      - 'GOOGLE_CLIENT_ID=void-oauth-credentials:client-id'
      - '--set-secrets'
      - 'GOOGLE_CLIENT_SECRET=void-oauth-credentials:client-secret'
      - '--set-secrets'
      - 'JWT_SECRET=void-jwt-secret:latest'
      - '--service-account'
      - 'void-service-account@$PROJECT_ID.iam.gserviceaccount.com'
      - '--vpc-connector'
      - 'void-vpc-connector'
    only:
      branches:
        - '^main$'
        - '^master$'

  # ========================================================================
  # Deploy to Staging
  # ========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-staging'
    dir: 'build-deps'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'void-cloud-ide-staging'
      - '--image'
      - 'gcr.io/$PROJECT_ID/void-cloud-ide:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--concurrency'
      - '10'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'NODE_ENV=staging'
      - '--set-secrets'
      - 'DATABASE_URL=void-db-credentials-staging:latest'
      - '--set-secrets'
      - 'REDIS_URL=void-redis-credentials-staging:latest'
      - '--set-secrets'
      - 'ANTHROPIC_API_KEY=void-api-keys-staging:anthropic'
      - '--set-secrets'
      - 'GEMINI_API_KEY=void-api-keys-staging:gemini'
    only:
      branches:
        - '^staging$'
        - '^dev$'

  # ========================================================================
  # Post-Deployment Smoke Tests
  # ========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'smoke-tests'
    dir: 'build-deps'
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "Running smoke tests..."

        SERVICE_URL=$(gcloud run services describe void-cloud-ide --region us-central1 --format 'value(status.url)')

        # Wait for service to be ready
        for i in $(seq 1 30); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/api/health" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Service is healthy"
            exit 0
          fi
          echo "Waiting for service to be ready... ($i/30)"
          sleep 10
        done

        echo "❌ Service failed health check"
        exit 1
    only:
      branches:
        - '^main$'
        - '^master$'

# ============================================================================
# Images to cache
# ============================================================================
images:
  - 'gcr.io/$PROJECT_ID/void-cloud-ide:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/void-cloud-ide:latest'

# ============================================================================
# Substitutions
# ============================================================================
substitutions:
  _ENV: production

# ============================================================================
# Options
# ============================================================================
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
